server:
  port: ${PORT:8082}
  servlet:
    context-path: /api/v1/auth
  compression:
    enabled: true
    mime-types:
      - application/json
      - text/plain
      - application/xml
    min-response-size: 1024

spring:
  application:
    name: authorization
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vaultix_auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: AuthHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:auth_user}
      password: ${SPRING_DATA_REDIS_PASSWORD:auth_password}
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50
        serialization-mode: via-dto

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:auth_user}
    password: ${SPRING_RABBITMQ_PASSWORD:auth_password}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

vaultix:
  admin:
    enabled: ${VAULTIX_ADMIN_ENABLED:true}
    username: ${VAULTIX_ADMIN_USERNAME:admin}
    email: ${VAULTIX_ADMIN_EMAIL:admin@vaultix.com}
    full-name: ${VAULTIX_ADMIN_FULL_NAME:Vaultix Administrator}
  security:
    lockout:
      max-failed-attempts: ${VAULTIX_AUTH_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
      duration: ${VAULTIX_AUTH_LOCKOUT_DURATION:15m}
    kek:
      master-key: ${VAULTIX_SECURITY_KEK_MASTER_KEY:3xhw5B4DZicmirWLS4h3ZkA4pBFZwyKlG6cvEYvdf7I=}
    jwt:
      issuer: ${VAULTIX_JWT_ISSUER:https://auth.vaultix.com}
      access-token-expiration: ${VAULTIX_JWT_ACCESS_TOKEN_EXPIRATION:5m}
      refresh-token-expiration: ${VAULTIX_JWT_REFRESH_TOKEN_EXPIRATION:7d}
      key-rotation-cron: ${VAULTIX_KEY_ROTATION_CRON:0 0 2 * * ?}
      key-cleanup-cron: ${VAULTIX_KEY_CLEANUP_CRON:0 10 2 * * ?}
      key-cleanup-grace-period: ${VAULTIX_KEY_CLEANUP_GRACE_PERIOD:7d}
      key-cleanup-batch-size: ${VAULTIX_KEY_CLEANUP_BATCH_SIZE:100}
      refresh-token-cleanup-cron: ${VAULTIX_REFRESH_TOKEN_CLEANUP_CRON:0 20 2 * * ?}
      refresh-token-cleanup-grace-period: ${VAULTIX_REFRESH_TOKEN_CLEANUP_GRACE_PERIOD:7d}
      refresh-token-cleanup-batch-size: ${VAULTIX_REFRESH_TOKEN_CLEANUP_BATCH_SIZE:500}
    role:
      cleanup-cron: ${VAULTIX_ROLE_CLEANUP_CRON:0 30 2 * * ?}
      cleanup-grace-period: ${VAULTIX_ROLE_CLEANUP_GRACE_PERIOD:30d}
      cleanup-batch-size: ${VAULTIX_ROLE_CLEANUP_BATCH_SIZE:100}
    user:
      cleanup-cron: ${VAULTIX_USER_CLEANUP_CRON:0 40 2 * * ?}
      cleanup-grace-period: ${VAULTIX_USER_CLEANUP_GRACE_PERIOD:90d}
      cleanup-batch-size: ${VAULTIX_USER_CLEANUP_BATCH_SIZE:100}
    otp:
      length: ${VAULTIX_OTP_LENGTH:6}
      default-ttl: ${VAULTIX_OTP_DEFAULT_TTL:10m}
      max-attempts: ${VAULTIX_OTP_MAX_ATTEMPTS:5}
    passkey:
      rp-id: ${VAULTIX_PASSKEY_RP_ID:localhost}
      rp-name: ${VAULTIX_PASSKEY_RP_NAME:Vaultix}
      allowed-origins: ${VAULTIX_PASSKEY_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  rabbitmq:
    exchange: ${VAULTIX_RABBITMQ_AUTH_EXCHANGE:auth.exchange}
    password-reset-routing-key: ${VAULTIX_RABBITMQ_AUTH_PASSWORD_RESET_ROUTING_KEY:auth.notification.password-reset}
    email-verification-routing-key: ${VAULTIX_RABBITMQ_AUTH_EMAIL_VERIFICATION_ROUTING_KEY:auth.notification.email-verification}
    phone-verification-routing-key: ${VAULTIX_RABBITMQ_AUTH_PHONE_VERIFICATION_ROUTING_KEY:auth.notification.phone-verification}
    welcome-routing-key: ${VAULTIX_RABBITMQ_AUTH_WELCOME_ROUTING_KEY:auth.notification.welcome}
    password-changed-routing-key: ${VAULTIX_RABBITMQ_AUTH_PASSWORD_CHANGED_ROUTING_KEY:auth.notification.password-changed}
    email-changed-routing-key: ${VAULTIX_RABBITMQ_AUTH_EMAIL_CHANGED_ROUTING_KEY:auth.notification.email-changed}
    phone-changed-routing-key: ${VAULTIX_RABBITMQ_AUTH_PHONE_CHANGED_ROUTING_KEY:auth.notification.phone-changed}
    email-reverted-routing-key: ${VAULTIX_RABBITMQ_AUTH_EMAIL_REVERTED_ROUTING_KEY:auth.notification.email-reverted}
    mfa-enabled-routing-key: ${VAULTIX_RABBITMQ_AUTH_MFA_ENABLED_ROUTING_KEY:auth.notification.mfa-enabled}
    mfa-disabled-routing-key: ${VAULTIX_RABBITMQ_AUTH_MFA_DISABLED_ROUTING_KEY:auth.notification.mfa-disabled}
    recovery-code-used-routing-key: ${VAULTIX_RABBITMQ_AUTH_RECOVERY_CODE_USED_ROUTING_KEY:auth.notification.recovery-code-used}
    recovery-codes-regenerated-routing-key: ${VAULTIX_RABBITMQ_AUTH_RECOVERY_CODES_REGENERATED_ROUTING_KEY:auth.notification.recovery-codes-regenerated}
